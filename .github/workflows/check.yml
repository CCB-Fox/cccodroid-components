# PR：检查配方格式，并对每个底座解一遍依赖（不打包、不需要任何密钥）
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: ${{ runner.temp }}/work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: greyoak111/cccodroid
          path: app
          sparse-checkout: devkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-recipes.mjs
      - run: node tools/ci-build.mjs --devkit app/devkit --dry
